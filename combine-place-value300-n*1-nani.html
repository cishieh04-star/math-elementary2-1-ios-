<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>數學冒險：幾個1合起來是多少</title>
    <!-- 引入灑花特效庫 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { 
            background: linear-gradient(135deg, #fdfbf7, #e0f2fe); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            padding: 10px; 
            font-family: "Microsoft JhengHei", sans-serif; 
            overflow: hidden; 
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .main-wrapper {
            width: 100%;
            max-width: 550px;
            max-height: 98vh;
            background: #ffffff;
            border: 4px solid #cbd5e1;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        #home-screen, #game-ui { 
            text-align: center; 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
        }
        
        #status-bar { 
            display: flex; 
            justify-content: space-around; 
            width: 100%; 
            font-size: 20px; 
            font-weight: bold; 
            color: #2c3e50; 
            border-bottom: 2px solid #e2e8f0; 
            padding-bottom: 8px; 
            margin-bottom: 8px;
        }
        
        /* 視覺提示區：十位與個位車廂 */
        #visual-area { 
            height: 110px; 
            width: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            background: #f8fafc;
            border-radius: 12px;
            border: 2px dashed #cbd5e1;
            padding: 5px;
            box-sizing: border-box;
        }
        .train-box { 
            min-width: 70px; 
            height: 70px; 
            background: #e2e8f0; 
            border: 2px solid #94a3b8;
            border-radius: 10px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .train-label {
            width: 100%;
            background: #cbd5e1;
            font-size: 13px;
            color: #334155;
            font-weight: bold;
            padding: 2px 0;
            border-bottom: 1px solid #94a3b8;
        }
        .train-value {
            font-size: 24px;
            font-weight: bold;
            color: #0f172a;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .train-box.target {
            background: #fde047;
            border: 3px dashed #ca8a04;
        }
        .train-box.target .train-label {
            background: #fef08a;
            color: #78350f;
        }
        .train-box.target .train-value {
            color: #78350f;
        }
        
        #question { font-size: 20px; font-weight: bold; color: #1e293b; margin: 8px 0; }
        #feedback { font-size: 18px; color: #e67e22; font-weight: bold; min-height: 28px; margin: 4px 0; }
        
        /* 掉落答案遊戲區域 */
        #drop-game-container {
            position: relative;
            width: 100%;
            height: 150px;
            background: #f1f5f9;
            border: 3px solid #cbd5e1;
            border-radius: 14px;
            overflow: hidden;
            box-sizing: border-box;
            margin-top: 5px;
        }

        /* 掉落的數字球選項 */
        .falling-option {
            position: absolute;
            width: 75px;
            height: 75px;
            background: radial-gradient(circle, #38bdf8 60%, #0284c7 100%);
            border: 3px solid #0369a1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            animation: fall linear forwards;
            z-index: 999;
            pointer-events: auto;
            -webkit-tap-highlight-color: transparent;
        }
        .falling-option:active { transform: scale(0.9); }

        @keyframes fall {
            0% { top: -75px; }
            100% { top: 75px; }
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        button#start-btn, .control-btn { 
            padding: 12px 35px; 
            font-size: 20px; 
            background: #3b82f6; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            box-shadow: 0 4px 10px rgba(59,130,246,0.3);
            font-weight: bold;
            touch-action: manipulation;
            z-index: 10;
        }
        button#start-btn:active, .control-btn:active { background: #2563eb; transform: scale(0.95); }
        
        #pause-btn {
            background: #d97706;
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <!-- 首頁畫面 -->
    <div id="home-screen">
        <h1 style="font-size: 32px; color: #1e293b; margin-bottom: 10px;">🚂 100以內位值組合</h1>
        <p style="color: #64748b; font-size: 15px; margin-bottom: 25px;">觀察十位與個位車廂，找出正確的數字！</p>
        <button id="start-btn" onclick="initGame()">開始玩遊戲</button>
    </div>

    <!-- 遊戲中畫面 -->
    <div id="game-ui" style="display:none;">
        <div id="status-bar">
            <div id="timer">時間: 00:00</div>
            <div id="score">闖關: 0</div>
        </div>
        
        <!-- 火車車廂視覺區：顯示十位與個位阿拉伯數字 -->
        <div id="visual-area"></div>
        <div id="question">合起來是多少呢？</div>
        <div id="feedback">注意看！數字掉下來囉！</div>
        
        <!-- 掉落答案區域 -->
        <div id="drop-game-container"></div>

        <!-- 暫停按鈕區 -->
        <div class="btn-group">
            <button id="pause-btn" class="control-btn" onclick="togglePause()">暫停遊戲</button>
        </div>
    </div>
</div>

    <script>
        let currentAns, score = 0;
        let gameInterval = null;
        let nextQuestionTimeout = null;
        let activeOptions = [];
        let isAnswered = false;
        let isPaused = false;
        let timerInterval = null;
        let totalSeconds = 0; 
        let audioCtx = null;
        let optionsArr = [];

        function speak(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'zh-TW';
            
            const voices = window.speechSynthesis.getVoices();
            const femaleVoice = voices.find(v => v.lang.includes('zh-TW') && (v.name.includes('Mei-Jia') || v.name.toLowerCase().includes('female')));
            if (femaleVoice) msg.voice = femaleVoice;
            
            window.speechSynthesis.speak(msg);
        }

        if (window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = () => {};
        }

        function playSuccessSound() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(350, audioCtx.currentTime);
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime + 0.15); 
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.3);  
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        function playErrorSound() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.setValueAtTime(150, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function initGame() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let unlockSpeech = new SpeechSynthesisUtterance('');
            window.speechSynthesis.speak(unlockSpeech);

            document.getElementById('home-screen').style.display = 'none';
            document.getElementById('game-ui').style.display = 'flex';
            score = 0;
            totalSeconds = 0;
            isPaused = false;
            
            const pauseBtn = document.getElementById('pause-btn');
            pauseBtn.innerText = "暫停遊戲";
            pauseBtn.style.backgroundColor = "#d97706";

            document.getElementById('score').innerText = `闖關: ${score}`;
            startTimer();
            loadQuestion();
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!isPaused) {
                    totalSeconds++;
                    let m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
                    let s = (totalSeconds % 60).toString().padStart(2, '0');
                    document.getElementById('timer').innerText = `時間: ${m}:${s}`;
                }
            }, 1000);
        }

        function togglePause() {
            isPaused = !isPaused;
            const pauseBtn = document.getElementById('pause-btn');
            
            if (isPaused) {
                pauseBtn.innerText = "繼續遊戲";
                pauseBtn.style.backgroundColor = "#16a34a";
                document.getElementById('feedback').innerText = "⏸️ 遊戲已暫停，慢慢思考喔！";
                activeOptions.forEach(el => el.style.animationPlayState = 'paused');
            } else {
                pauseBtn.innerText = "暫停遊戲";
                pauseBtn.style.backgroundColor = "#d97706";
                document.getElementById('feedback').innerText = "▶️ 遊戲繼續！加油！";
                activeOptions.forEach(el => el.style.animationPlayState = 'running');
                if (isAnswered) loadQuestion();
            }
        }

        function loadQuestion() {
            isAnswered = false;
            if (nextQuestionTimeout) clearTimeout(nextQuestionTimeout);

            if (!isPaused) {
                document.getElementById('feedback').innerText = "注意看！答案數字掉下來囉！";
            }
            
            activeOptions.forEach(el => el.remove());
            activeOptions = [];
            if (gameInterval) clearInterval(gameInterval);

            // 100以內的數字：隨機產生十位 (1~9) 與個位 (0~9)
            let tens = Math.floor(Math.random() * 9) + 1; 
            let ones = Math.floor(Math.random() * 10);    
            currentAns = (tens * 10) + ones;

            renderTrain(tens, ones);
            
            let questionStr = `${currentAns} 個 1 合起來是多少？`;
            document.getElementById('question').innerText = questionStr;
            speak(questionStr);

            // 產生 4 個 100 以下的選項
            let options = new Set([currentAns]);
            while(options.size < 4) {
                let rT = Math.floor(Math.random() * 9) + 1;
                let rU = Math.floor(Math.random() * 10);
                let randVal = (rT * 10) + rU;
                options.add(randVal);
            }
            optionsArr = Array.from(options).sort(() => Math.random() - 0.5);

            let index = 0;
            gameInterval = setInterval(() => {
                if (isPaused) return; 
                if (isAnswered) {
                    clearInterval(gameInterval);
                    return;
                }
                if (index >= optionsArr.length) index = 0;
                spawnFallingOption(optionsArr[index]);
                index++;
            }, 2000);
        }

        function renderTrain(tens, ones) {
            let area = document.getElementById('visual-area');
            area.innerHTML = '';

            // 十位車廂
            let boxT = document.createElement('div');
            boxT.className = 'train-box';
            boxT.innerHTML = `<div class="train-label">十位</div><div class="train-value">${tens}</div>`;
            
            // 加號
            let plus = document.createElement('div');
            plus.style.fontSize = '22px';
            plus.style.fontWeight = 'bold';
            plus.style.color = '#64748b';
            plus.innerText = '＋';

            // 個位車廂
            let boxU = document.createElement('div');
            boxU.className = 'train-box';
            boxU.innerHTML = `<div class="train-label">個位</div><div class="train-value">${ones}</div>`;

            // 等於號
            let equal = document.createElement('div');
            equal.style.fontSize = '22px';
            equal.style.fontWeight = 'bold';
            equal.style.color = '#64748b';
            equal.innerText = '＝';

            // 合起來目標車廂（答對後會把答案阿拉伯數字填在上方）
            let boxTotal = document.createElement('div');
            boxTotal.className = 'train-box target';
            boxTotal.innerHTML = `<div class="train-label">合起來</div><div class="train-value" id="trainTarget">?</div>`;

            area.appendChild(boxT);
            area.appendChild(plus);
            area.appendChild(boxU);
            area.appendChild(equal);
            area.appendChild(boxTotal);
        }

        function spawnFallingOption(val) {
            if (isAnswered) return;
            const container = document.getElementById('drop-game-container');
            const el = document.createElement('div');
            el.className = 'falling-option';
            el.innerText = val;

            const randomX = Math.random() * (container.clientWidth - 75);
            el.style.left = randomX + 'px';
            const duration = 4 + Math.random();
            el.style.animationDuration = duration + 's';

            if (isPaused) el.style.animationPlayState = 'paused';

            let isHandled = false;
            const handleSelect = function(e) {
                if (e.cancelable) e.preventDefault();
                e.stopPropagation();
                if (isAnswered || isPaused || isHandled) return;
                isHandled = true;

                if (val === currentAns) {
                    isAnswered = true;
                    score++;
                    document.getElementById('score').innerText = `闖關: ${score}`;
                    
                    playSuccessSound();
                    confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });

                    let targetBox = document.getElementById('trainTarget');
                    if (targetBox) {
                        targetBox.innerText = currentAns;
                        targetBox.parentElement.style.background = '#86efac';
                        targetBox.parentElement.style.borderColor = '#22c55e';
                    }

                    document.getElementById('feedback').innerText = "🎉 太棒了！火車順利開走了！";
                    speak(`答對了，就是${currentAns}！`);

                    clearInterval(gameInterval);
                    activeOptions.forEach(opt => opt.remove());
                    activeOptions = [];

                    nextQuestionTimeout = setTimeout(() => {
                        if (!isPaused) loadQuestion();
                    }, 3000);
                } else {
                    playErrorSound();
                    speak("再算算看喔！");
                    document.getElementById('feedback').innerText = "❌ 數字不對喔，再試一次！";
                    el.style.transition = "opacity 0.3s";
                    el.style.opacity = "0";
                    setTimeout(() => el.remove(), 300);
                }
            };

            el.addEventListener('click', handleSelect);
            el.addEventListener('touchstart', handleSelect, { passive: false });

            el.addEventListener('animationend', () => {
                el.remove();
                activeOptions = activeOptions.filter(item => item !== el);
            });

            container.appendChild(el);
            activeOptions.push(el);
        }
    </script>
</body>
</html>
