<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>100以內的數字接力遊戲(間隔1、2、5、10)</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: linear-gradient(135deg, #fdfbf7, #e0f2fe);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; height: 100dvh; margin: 0; padding: 10px;
            font-family: "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation;
        }

        .main-wrapper {
            width: 100%; max-width: 580px; max-height: 98vh; height: 100%;
            background: #ffffff; border: 4px solid #cbd5e1; border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 14px; box-sizing: border-box;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            gap: 6px; position: relative; overflow-y: auto;
        }

        #home-screen { text-align: center; width: 100%; display: flex; flex-direction: column; align-items: center; overflow-y: auto; padding: 4px; }
        h1 { font-size: 26px; color: #1e293b; margin: 4px 0; }
        .subtitle { color: #0284c7; font-size: 13px; font-weight: bold; margin: 0 0 10px 0; }

        .intro-card {
            background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px;
            padding: 8px 14px; margin-bottom: 12px; width: 100%; box-sizing: border-box; text-align: left;
        }
        .intro-card p { margin: 0 0 4px 0; font-size: 13px; font-weight: bold; color: #334155; }
        .intro-card ul { margin: 0; padding-left: 18px; font-size: 12px; color: #64748b; line-height: 1.5; }

        .level-pick-title { font-size: 13px; font-weight: bold; color: #0284c7; margin: 6px 0 6px 0; width: 100%; text-align: left; }

        .step-pick-row { display: flex; gap: 6px; width: 100%; margin-bottom: 6px; flex-wrap: wrap; }
        .step-btn {
            flex: 1; min-width: 70px; background: #fff; border: 2px solid #bae6fd; border-radius: 12px;
            padding: 8px 4px; cursor: pointer; text-align: center;
        }
        .step-btn.active { background: #0284c7; border-color: #026aa7; }
        .step-btn.active .step-num, .step-btn.active .step-sub { color: #fff; }
        .step-btn .step-num { font-size: 17px; font-weight: bold; color: #0284c7; display: block; }
        .step-btn .step-sub { font-size: 10px; color: #64748b; }
        .step-btn:active { transform: scale(0.97); }

        .level-btn {
            width: 100%; text-align: left; background: #fff; border: 2px solid #bae6fd;
            border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; cursor: pointer;
            display: flex; flex-direction: column; gap: 2px;
        }
        .level-btn:active { transform: scale(0.98); background: #f0f9ff; }
        .level-btn .lv-name { font-size: 14px; font-weight: bold; color: #0284c7; }
        .level-btn .lv-desc { font-size: 11px; color: #334155; }

        #game-ui { text-align: center; width: 100%; display: none; flex-direction: column; align-items: center; flex: 1 1 auto; min-height: 0; }

        #status-bar {
            display: flex; justify-content: space-between; align-items: center; width: 100%;
            font-size: 13px; font-weight: bold; color: #2c3e50; border-bottom: 2px solid #e2e8f0;
            padding-bottom: 6px; margin-bottom: 4px; flex-wrap: wrap; row-gap: 4px; flex-shrink: 0;
        }
        .status-left { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.25; }
        .status-left .level-label { font-size: 11px; color: #0284c7; }
        .status-right { display: flex; gap: 4px; flex-wrap: wrap; row-gap: 4px; }

        .control-btn {
            padding: 5px 9px; font-size: 12px; background: #3b82f6; color: white; border: none;
            border-radius: 8px; cursor: pointer; font-weight: bold; touch-action: manipulation;
        }
        .control-btn:active { background: #2563eb; transform: scale(0.95); }
        #pause-btn { background: #d97706; }
        .hint-btn-el { background: #16a34a; }
        .switch-btn-el { background: #64748b; }

        .speed-row { display: flex; gap: 4px; width: 100%; justify-content: center; margin-bottom: 4px; flex-shrink: 0; }
        .speed-btn {
            flex: 1; max-width: 100px; background: #f1f5f9; color: #334155; border: 2px solid #cbd5e1;
            border-radius: 8px; padding: 4px 4px; font-size: 12px; font-weight: bold; cursor: pointer;
        }
        .speed-btn.active { background: #3b82f6; color: #fff; border-color: #2563eb; }
        .speed-btn:active { transform: scale(0.95); }

        /* 視覺提示區：逼真的火車車廂軌道區 */
        #visual-area {
            height: 130px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
            background: linear-gradient(to bottom, #e0f2fe 70%, #94a3b8 70%, #94a3b8 76%, #f8fafc 76%);
            border-radius: 12px; border: 2px dashed #cbd5e1; padding: 5px; box-sizing: border-box;
            position: relative; flex-shrink: 0;
        }
        .train-carriage { position: relative; display: flex; flex-direction: column; align-items: center; }
        .train-box {
            width: 68px; height: 62px; background: #3b82f6; border: 3px solid #1e40af;
            border-radius: 12px 12px 6px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 21px; font-weight: bold; color: #ffffff; box-shadow: 0 5px 10px rgba(0,0,0,0.15); z-index: 2;
        }
        .train-window {
            width: 42px; height: 22px; background: #e0f2fe; border: 2px solid #1e40af; border-radius: 4px;
            display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: bold; color: #1e293b;
        }
        .train-wheels { display: flex; gap: 22px; margin-top: -4px; z-index: 3; }
        .wheel { width: 13px; height: 13px; background: #334155; border: 2px solid #cbd5e1; border-radius: 50%; }
        .train-connector { width: 11px; height: 6px; background: #475569; margin-bottom: 22px; }
        .train-box.target { background: #eab308; border-color: #854d0e; animation: targetPulse 1.2s infinite; }
        .train-box.target .train-window { background: #fef08a; border-color: #854d0e; color: #b45309; }
        @keyframes targetPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        #question { font-size: 18px; font-weight: bold; color: #1e293b; margin: 6px 0; flex-shrink: 0; }
        #feedback { font-size: 16px; color: #e67e22; font-weight: bold; min-height: 24px; margin: 3px 0; flex-shrink: 0; }

        #drop-game-container {
            position: relative; width: 100%; height: 130px; min-height: 130px; flex-grow: 1; max-height: 220px;
            background: linear-gradient(180deg, #dff3ff, #f1f5f9);
            border: 3px solid #cbd5e1; border-radius: 14px;
            overflow: hidden; box-sizing: border-box; margin-top: 4px; touch-action: manipulation;
        }
        /* 氣球：從下面慢慢往上飄，左右輕輕搖擺，答對時會開心戳破 */
        .falling-option {
            position: absolute; width: 62px; height: 74px;
            border-radius: 50% 50% 50% 50% / 58% 58% 42% 42%;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; font-weight: bold; color: #ffffff; cursor: pointer;
            text-shadow: 0 1px 3px rgba(0,0,0,0.55), 0 0 3px rgba(0,0,0,0.4);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2),
                        inset -8px -8px 14px rgba(0,0,0,0.15),
                        inset 8px 8px 14px rgba(255,255,255,0.45);
            animation: floatUp linear forwards;
            z-index: 999; pointer-events: auto;
        }
        .falling-option::before {
            content: ''; position: absolute; bottom: -6px; left: 50%;
            width: 0; height: 0; transform: translateX(-50%);
            border-left: 5px solid transparent; border-right: 5px solid transparent;
            border-top: 7px solid var(--balloon-dark, #b91c1c);
        }
        .falling-option::after {
            content: ''; position: absolute; bottom: -26px; left: 50%;
            width: 2px; height: 24px; background: #94a3b8; transform: translateX(-50%);
        }
        .falling-option:active { transform: scale(0.92); }
        .falling-option.hint-glow {
            box-shadow: 0 0 0 4px #fde047, 0 4px 10px rgba(0,0,0,0.35);
            animation: floatUp linear forwards, glowPulse 1s ease-in-out infinite;
        }
        .falling-option.popping { animation: popEffect 0.32s ease-out forwards !important; pointer-events: none; }
        @keyframes glowPulse { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.35); } }
        @keyframes popEffect {
            0% { transform: scale(1) rotate(0deg); opacity: 1; }
            35% { transform: scale(1.35) rotate(-4deg); opacity: 1; }
            100% { transform: scale(0.15) rotate(6deg); opacity: 0; }
        }
        @keyframes floatUp {
            0%   { top: 100%; transform: translateX(0) rotate(-3deg); }
            25%  { transform: translateX(9px) rotate(3deg); }
            50%  { transform: translateX(-7px) rotate(-3deg); }
            75%  { transform: translateX(7px) rotate(3deg); }
            100% { top: -95px; transform: translateX(-4px) rotate(-2deg); }
        }

        .btn-group { display: flex; gap: 10px; margin-top: 6px; flex-shrink: 0; }

        #completeOverlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.97); border-radius: 18px; flex-direction: column;
            align-items: center; justify-content: center; gap: 10px; z-index: 5000; text-align: center; padding: 16px;
        }
        #completeOverlay .equation {
            font-family: monospace; font-size: 21px; font-weight: bold; color: #0284c7;
            background: #f0f9ff; border: 3px solid #bae6fd; border-radius: 10px; padding: 10px 16px;
        }
        #completeOverlay .cheer { font-size: 16px; font-weight: bold; color: #1e40af; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div id="home-screen">
        <h1>🚂 100以內的數字接力遊戲(間隔1、2、5、10)</h1>
        <p class="subtitle">🌟 語音互動 × 數字序列推理 × 氣球闖關！</p>

        <div class="intro-card">
            <p>📖 遊戲怎麼玩：</p>
            <ul>
                <li>觀察上方火車車廂，找出被問號擋住的正確數字。</li>
                <li>點擊畫面上飄上來的氣球，戳破正確答案就能過關！</li>
                <li>卡住了嗎？按「💡提示」會給你線索！</li>
            </ul>
        </div>

        <div class="level-pick-title">① 請選擇間隔：</div>
        <div class="step-pick-row" id="stepPickRow"></div>

        <div class="level-pick-title">② 請選擇關卡：</div>
        <div id="levelList" style="width:100%;"></div>
    </div>

    <div id="game-ui">
        <div id="status-bar">
            <div class="status-left">
                <span class="level-label" id="levelLabel">關卡</span>
                <div style="display:flex; gap:8px;">
                    <span id="timer">時間: 00:00</span>
                    <span id="score">闖關: 0</span>
                </div>
            </div>
            <div class="status-right">
                <button class="control-btn hint-btn-el" onclick="useHint()">💡提示</button>
                <button class="control-btn" id="pause-btn" onclick="togglePause()">暫停</button>
                <button class="control-btn switch-btn-el" onclick="showLevelSelect()">🔄換關卡</button>
            </div>
        </div>

        <div class="speed-row">
            <button class="speed-btn" id="speedSlow" onclick="setSpeed('slow')">🐢慢</button>
            <button class="speed-btn active" id="speedNormal" onclick="setSpeed('normal')">🚶正常</button>
            <button class="speed-btn" id="speedFast" onclick="setSpeed('fast')">🐇快</button>
        </div>

        <div id="visual-area"></div>
        <div id="question">火車空格是多少呢？</div>
        <div id="feedback">注意看！氣球飄上來囉！</div>

        <div id="drop-game-container"></div>

        <div class="btn-group"></div>

        <div id="completeOverlay">
            <div class="equation" id="completeEquation">2 → 4 → 6 → 8</div>
            <div class="cheer">🌟 太棒了，過關了！</div>
        </div>
    </div>
</div>

<script>
    const MIN_NUM = 1, MAX_NUM = 99;
    const STEP_OPTIONS = [1, 2, 5, 10];
    let STEP = 1;

    const LEVELS = [
        { id: 1, name: '第一關：遞增練習', desc: '車廂數字一路變大，空格都在最後一節。', forceDir: 'asc', blankMode: 'last' },
        { id: 2, name: '第二關：遞減練習', desc: '車廂數字一路變小，空格都在最後一節。', forceDir: 'desc', blankMode: 'last' },
        { id: 3, name: '第三關：判斷方向', desc: '可能遞增也可能遞減，空格還是在最後一節。', forceDir: null, blankMode: 'last' },
        { id: 4, name: '第四關：綜合挑戰', desc: '方向不固定，空格也可能出現在中間或最前面！', forceDir: null, blankMode: 'any' }
    ];

    let currentLevel = null;
    let currentAns, score = 0;
    let gameInterval = null;
    let nextQuestionTimeout = null;
    let activeOptions = [];
    let isAnswered = false;
    let isPaused = false;
    let pendingNextQuestion = false;
    let timerInterval = null;
    let totalSeconds = 0;
    let audioCtx = null;
    let optionsArr = [];
    let trainSequence = [];
    let hintLevel = 0;
    let hintActiveValue = null;
    let speedMode = 'normal';

    const SPEED_SETTINGS = {
        slow:   { fallDuration: 7.5, spawnInterval: 2800 },
        normal: { fallDuration: 5,   spawnInterval: 2000 },
        fast:   { fallDuration: 3,   spawnInterval: 1300 }
    };

    function speak(text) {
        if (isPaused || !window.speechSynthesis) return;
        try {
            window.speechSynthesis.cancel();
            // 取消跟念新語音中間留一點緩衝，減少部分裝置銜接太快產生怪音的機會
            setTimeout(() => {
                if (isPaused) return;
                try {
                    const msg = new SpeechSynthesisUtterance(text);
                    msg.lang = 'zh-TW';
                    msg.rate = 0.9;
                    msg.pitch = 1.1; // 音調微調高一點，聽起來更柔和自然
                    const voices = window.speechSynthesis.getVoices();
                    const preferred = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('zh') &&
                        /female|女|meijia|mei-jia|yating|tingting|xiaoxiao/i.test(v.name));
                    if (preferred) msg.voice = preferred;
                    window.speechSynthesis.speak(msg);
                } catch (e) {}
            }, 70);
        } catch (e) {}
    }
    if (window.speechSynthesis) window.speechSynthesis.onvoiceschanged = () => {};

    function boom() { try { confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } }); } catch (e) {} }

    /* ========================================================
       音效重新設計：用多個正弦波疊出比較有「琴音／鐘聲」質感的
       和弦音色，取代單一振盪器的生硬電子聲；答錯改用柔和的雙音
       取代刺耳的鋸齒波，避免有懲罰感。
       ======================================================== */
    function playTone(freq, startTime, duration, peakVol, type) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, startTime);
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(peakVol, startTime + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(startTime); osc.stop(startTime + duration + 0.02);
    }

    function playSuccessSound() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        // C5 - E5 - G5 - C6 大三和弦琶音，明亮愉快、聽起來像小鐘聲
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, i) => {
            const t = now + i * 0.085;
            playTone(freq, t, 0.34, 0.26, 'sine');
            playTone(freq * 2, t, 0.28, 0.07, 'sine'); // 疊加高八度泛音，音色更豐富
        });
    }
    function playErrorSound() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        // 兩個溫和下降的音，取代原本刺耳的鋸齒波，不會有懲罰感
        playTone(300, now, 0.16, 0.22, 'sine');
        playTone(230, now + 0.13, 0.18, 0.22, 'sine');
    }
    function playPopSound() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(720, now);
        osc.frequency.exponentialRampToValueAtTime(110, now + 0.11);
        gain.gain.setValueAtTime(0.38, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.14);
    }

    function renderStepPicker() {
        const container = document.getElementById('stepPickRow');
        container.innerHTML = '';
        STEP_OPTIONS.forEach(s => {
            const btn = document.createElement('div');
            btn.className = 'step-btn' + (s === STEP ? ' active' : '');
            btn.innerHTML = `<span class="step-num">間隔${s}</span><span class="step-sub">每次±${s}</span>`;
            btn.addEventListener('pointerdown', (e) => { e.preventDefault(); STEP = s; renderStepPicker(); });
            container.appendChild(btn);
        });
    }

    function renderLevelList() {
        const container = document.getElementById('levelList');
        container.innerHTML = '';
        LEVELS.forEach(lv => {
            const btn = document.createElement('div');
            btn.className = 'level-btn';
            btn.innerHTML = `<span class="lv-name">${lv.name}</span><span class="lv-desc">${lv.desc}</span>`;
            btn.addEventListener('pointerdown', (e) => { e.preventDefault(); startGame(lv.id); });
            container.appendChild(btn);
        });
    }

    function showLevelSelect() {
        isPaused = false;
        pendingNextQuestion = false;
        if (gameInterval) clearInterval(gameInterval);
        if (nextQuestionTimeout) clearTimeout(nextQuestionTimeout);
        if (timerInterval) clearInterval(timerInterval);
        activeOptions.forEach(el => el.remove());
        activeOptions = [];
        hideCompletionScreen();
        try { window.speechSynthesis.cancel(); } catch (e) {}
        document.getElementById('game-ui').style.display = 'none';
        document.getElementById('home-screen').style.display = 'flex';
    }

    function startGame(levelId) {
        if (document.getElementById('home-screen').style.display === 'none') return;
        currentLevel = LEVELS.find(l => l.id === levelId);
        document.getElementById('levelLabel').innerText = `間隔${STEP}．${currentLevel.name}`;

        if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        try { window.speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch (e) {}

        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('game-ui').style.display = 'flex';
        score = 0;
        totalSeconds = 0;
        document.getElementById('score').innerText = `闖關: ${score}`;
        const pauseBtn = document.getElementById('pause-btn');
        pauseBtn.innerText = "暫停"; pauseBtn.style.backgroundColor = "#d97706";
        startTimer();
        loadQuestion();
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (!isPaused) {
                totalSeconds++;
                let m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
                let s = (totalSeconds % 60).toString().padStart(2, '0');
                document.getElementById('timer').innerText = `時間: ${m}:${s}`;
            }
        }, 1000);
    }

    function setSpeed(mode) {
        speedMode = mode;
        ['slow', 'normal', 'fast'].forEach(m => {
            document.getElementById('speed' + m.charAt(0).toUpperCase() + m.slice(1)).classList.toggle('active', m === mode);
        });
        if (!isPaused && !isAnswered && currentLevel) startSpawning();
    }

    function togglePause() {
        if (!currentLevel) return;
        isPaused = !isPaused;
        const pauseBtn = document.getElementById('pause-btn');

        if (isPaused) {
            pauseBtn.innerText = "繼續";
            pauseBtn.style.backgroundColor = "#16a34a";
            document.getElementById('feedback').innerText = "⏸️ 遊戲已暫停，慢慢思考喔！";
            activeOptions.forEach(el => el.style.animationPlayState = 'paused');
            if (gameInterval) clearInterval(gameInterval);
            if (nextQuestionTimeout) clearTimeout(nextQuestionTimeout);
            try { window.speechSynthesis.cancel(); } catch (e) {}
        } else {
            pauseBtn.innerText = "暫停";
            pauseBtn.style.backgroundColor = "#d97706";
            document.getElementById('feedback').innerText = "▶️ 遊戲繼續！加油！";
            activeOptions.forEach(el => el.style.animationPlayState = 'running');
            if (pendingNextQuestion) {
                pendingNextQuestion = false;
                loadQuestion();
            } else if (isAnswered) {
                loadQuestion();
            } else {
                startSpawning();
            }
        }
    }

    function loadQuestion() {
        if (!currentLevel) return;
        isAnswered = false;
        hintLevel = 0;
        hintActiveValue = null;
        hideCompletionScreen();
        if (nextQuestionTimeout) clearTimeout(nextQuestionTimeout);

        if (!isPaused) document.getElementById('feedback').innerText = "火車車廂少了一個數字，找找看！";

        activeOptions.forEach(el => el.remove());
        activeOptions = [];
        if (gameInterval) clearInterval(gameInterval);

        let isAscending = currentLevel.forceDir === 'asc' ? true
            : currentLevel.forceDir === 'desc' ? false
            : Math.random() < 0.5;

        let baseMin, baseMax;
        if (isAscending) { baseMin = MIN_NUM; baseMax = MAX_NUM - 3 * STEP; }
        else { baseMin = MIN_NUM + 3 * STEP; baseMax = MAX_NUM; }
        if (baseMax < baseMin) baseMax = baseMin;
        const baseNum = baseMin + Math.floor(Math.random() * (baseMax - baseMin + 1));
        const actualStep = isAscending ? STEP : -STEP;

        trainSequence = [];
        for (let i = 0; i < 4; i++) trainSequence.push(baseNum + i * actualStep);

        const blankIndex = currentLevel.blankMode === 'last' ? 3 : Math.floor(Math.random() * 4);
        currentAns = trainSequence[blankIndex];

        renderTrain(trainSequence, blankIndex);
        speak(`看看火車車廂，空格的數字是多少呢？`);

        let visibleValues = new Set(trainSequence.filter((v, idx) => idx !== blankIndex));
        let options = new Set([currentAns]);
        let attempts = 0;
        while (options.size < 4 && attempts < 100) {
            attempts++;
            let randVal = MIN_NUM + Math.floor(Math.random() * (MAX_NUM - MIN_NUM + 1));
            if (!options.has(randVal) && !visibleValues.has(randVal)) options.add(randVal);
        }
        let filler = MIN_NUM;
        while (options.size < 4 && filler <= MAX_NUM) {
            if (!options.has(filler) && !visibleValues.has(filler)) options.add(filler);
            filler++;
        }
        optionsArr = Array.from(options).sort(() => Math.random() - 0.5);

        startSpawning();
    }

    function startSpawning() {
        if (isPaused || isAnswered || !currentLevel) return;
        if (gameInterval) clearInterval(gameInterval);
        let index = 0;
        gameInterval = setInterval(() => {
            if (isPaused) return;
            if (isAnswered) { clearInterval(gameInterval); return; }
            if (index >= optionsArr.length) index = 0;
            spawnFallingOption(optionsArr[index]);
            index++;
        }, SPEED_SETTINGS[speedMode].spawnInterval);
    }

    function renderTrain(seq, blankIdx) {
        let area = document.getElementById('visual-area');
        area.innerHTML = '';
        seq.forEach((num, idx) => {
            let carriage = document.createElement('div');
            carriage.className = 'train-carriage';
            let box = document.createElement('div');
            box.className = 'train-box';
            let windowDiv = document.createElement('div');
            windowDiv.className = 'train-window';
            if (idx === blankIdx) { box.classList.add('target'); windowDiv.innerText = '?'; windowDiv.id = 'trainTarget'; }
            else windowDiv.innerText = num;
            box.appendChild(windowDiv);
            carriage.appendChild(box);
            let wheels = document.createElement('div');
            wheels.className = 'train-wheels';
            wheels.innerHTML = '<div class="wheel"></div><div class="wheel"></div>';
            carriage.appendChild(wheels);
            area.appendChild(carriage);
            if (idx < seq.length - 1) {
                let connector = document.createElement('div');
                connector.className = 'train-connector';
                area.appendChild(connector);
            }
        });
    }

    function useHint() {
        if (isPaused || isAnswered || !currentLevel) return;
        hintLevel++;
        let blankIndex = trainSequence.indexOf(currentAns);
        let isAscending = trainSequence.length > 1 && trainSequence[1] > trainSequence[0];

        if (hintLevel === 1) {
            let neighborVal, direction;
            if (blankIndex > 0) {
                neighborVal = trainSequence[blankIndex - 1];
                direction = isAscending ? `多 ${STEP}` : `少 ${STEP}`;
            } else {
                neighborVal = trainSequence[blankIndex + 1];
                direction = isAscending ? `少 ${STEP}` : `多 ${STEP}`;
            }
            const text = `🔍 提示：旁邊車廂是 ${neighborVal}，這一格要比它${direction}喔！`;
            document.getElementById('feedback').innerText = text;
            speak(text.replace('🔍 提示：', ''));
        } else {
            const text = `💡 答案是 ${currentAns}！找找看畫面上的這個數字！`;
            document.getElementById('feedback').innerText = text;
            speak(`答案是 ${currentAns}，找找看畫面上的這個數字！`);
            hintActiveValue = currentAns;
            activeOptions.forEach(opt => { if (opt.innerText.trim() === String(currentAns)) opt.classList.add('hint-glow'); });
        }
    }

    function showCompletionScreen() {
        document.getElementById('completeEquation').innerText = trainSequence.join(' → ');
        document.getElementById('completeOverlay').style.display = 'flex';
    }
    function hideCompletionScreen() { document.getElementById('completeOverlay').style.display = 'none'; }

    function spawnFallingOption(val) {
        if (isAnswered) return;
        const container = document.getElementById('drop-game-container');
        const el = document.createElement('div');
        el.className = 'falling-option';
        el.innerText = val;
        if (hintActiveValue !== null && val === hintActiveValue) el.classList.add('hint-glow');

        const colors = ['#dc2626', '#c2410c', '#ca8a04', '#16a34a', '#0284c7', '#7c3aed', '#db2777'];
        const dark = colors[Math.floor(Math.random() * colors.length)];
        el.style.background = `radial-gradient(circle at 30% 25%, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0.08) 16%, ${dark} 42%, ${dark} 100%)`;
        el.style.setProperty('--balloon-dark', dark);

        const randomX = Math.random() * (container.clientWidth - 62);
        el.style.left = randomX + 'px';
        el.style.animationDuration = SPEED_SETTINGS[speedMode].fallDuration + 's';
        if (isPaused) el.style.animationPlayState = 'paused';

        let isHandled = false;
        const handleSelect = function (e) {
            if (e.cancelable) e.preventDefault();
            e.stopPropagation();
            if (isAnswered || isPaused || isHandled) return;
            isHandled = true;

            if (val === currentAns) {
                isAnswered = true;
                score++;
                document.getElementById('score').innerText = `闖關: ${score}`;

                playPopSound();
                el.classList.add('popping');
                setTimeout(() => el.remove(), 320);
                clearInterval(gameInterval);
                activeOptions.forEach(opt => { if (opt !== el) opt.remove(); });
                activeOptions = [];
                setTimeout(() => { playSuccessSound(); boom(); }, 150);

                let targetBox = document.getElementById('trainTarget');
                if (targetBox) {
                    targetBox.innerText = currentAns;
                    targetBox.style.background = '#86efac';
                    targetBox.style.borderColor = '#16a34a';
                    targetBox.style.color = '#166534';
                    targetBox.parentElement.style.background = '#22c55e';
                    targetBox.parentElement.style.borderColor = '#15803d';
                    targetBox.parentElement.style.animation = 'none';
                }
                document.getElementById('feedback').innerText = "🎉 太棒了！火車順利開走了！";

                showCompletionScreen();
                pendingNextQuestion = true;
                const goNext = () => {
                    if (!pendingNextQuestion) return;
                    if (isPaused) return;
                    if (nextQuestionTimeout) clearTimeout(nextQuestionTimeout);
                    pendingNextQuestion = false;
                    loadQuestion();
                };
                speak(`答對了，就是 ${currentAns}！`);
                if (nextQuestionTimeout) clearTimeout(nextQuestionTimeout);
                nextQuestionTimeout = setTimeout(goNext, 3000);

            } else {
                playErrorSound();
                speak("再算算看喔！");
                document.getElementById('feedback').innerText = "❌ 數字不對喔，再試一次！";
                el.style.transition = "opacity 0.3s";
                el.style.opacity = "0";
                setTimeout(() => el.remove(), 300);
            }
        };

        el.addEventListener('pointerdown', handleSelect);
        el.addEventListener('animationend', () => {
            el.remove();
            activeOptions = activeOptions.filter(item => item !== el);
        });

        container.appendChild(el);
        activeOptions.push(el);
    }

    renderStepPicker();
    renderLevelList();
</script>
